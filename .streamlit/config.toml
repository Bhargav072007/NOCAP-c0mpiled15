[theme]
base = "dark"
primaryColor = "#78F59B"
backgroundColor = "#0C1B14"
secondaryBackgroundColor = "#14291D"
textColor = "#F2F8F0"
font = "sans-serif"
baseFontSize = 16
baseRadius = "large"
buttonRadius = "medium"

[server]
enableStaticServing = true
maxUploadSize = 25
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
