[theme]
base = "dark"
primaryColor = "#F5F5F5"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#111111"
textColor = "#F5F5F5"
font = "sans-serif"
baseFontSize = 16
baseRadius = "large"
buttonRadius = "full"

[server]
maxUploadSize = 25
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
